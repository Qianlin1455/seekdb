/*
 * seekdb.h implemented in process by the Rust crate rust/in-process.
 * Generated by cbindgen from rust/in-process/src/api.rs. DO NOT EDIT: change
 * the Rust side instead, then rebuild.
 *
 * seekdb_open(db_dir, parameters, out_handle) opens a seekdb instance rooted
 * at db_dir. parameters is an optional NULL-terminated array of key/value
 * pairs:
 *   {"memory_budget", "10G", "syslog_max_file", "1000", NULL}
 * Driver-reserved keys (not forwarded as server parameters):
 *   port: omit or "0"; the in-process engine has no TCP listener.
 *   mysql_port_mode: omit or "disabled".
 * All other keys are seekdb server parameters, passed on first init only. On
 * first init the driver always seeds memory_budget=1G and log_disk_size=2G
 * unless the caller overrides them; a platform may seed more defaults and fix
 * more parameters on every start. On restart, persisted values are kept
 * (issue #26).
 *
 * seekdb_last_open_error() describes the most recent seekdb_open failure on
 * the calling thread. It is empty before the first open and after a
 * successful open. The borrowed string remains valid until the next
 * seekdb_open on this thread (or thread exit). No handle is required. Copy it
 * before another open if it must be retained. Startup diagnostics describe the
 * driver stage; server-internal failures may require inspecting the
 * instance's log directory.
 *
 * seekdb_connection_options(handle, out_options) returns the MySQL-protocol
 * connection options for an open handle. transport is "tcp", "unix_socket",
 * or "named_pipe". TCP returns host and port; local transports return their
 * corresponding named field. Unused transport fields are NULL and port is
 * zero for local transports. user is always "root". The in-process engine
 * always uses "unix_socket"; a long socket path is replaced by a per-handle
 * short alias in a platform directory (on iOS the App's tmp directory, or
 * /tmp on the Simulator). Returned strings are borrowed and remain valid until
 * seekdb_close(handle).
 */"""
after_includes = """#define SEEKDB_CONNECTION_TRANSPORT_TCP "tcp"
#define SEEKDB_CONNECTION_TRANSPORT_UNIX_SOCKET "unix_socket"
#define SEEKDB_CONNECTION_TRANSPORT_NAMED_PIPE "named_pipe\""""

[export]
include = ["SeekdbReturnCode"]
